# Integración continua: en cada push o pull request se ejecutan el análisis estático, las pruebas con
# cobertura (contra PostgreSQL real) y la compilación del frontend. Evidencia de REQ-08 del informe de Calidad.
name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eps_app
          POSTGRES_PASSWORD: clave_solo_para_ci
          POSTGRES_DB: eps_citas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eps_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      EPS_CLAVE_SECRETA: clave-solo-para-integracion-continua
      EPS_BD_NOMBRE: eps_citas
      EPS_BD_USUARIO: eps_app
      EPS_BD_CLAVE: clave_solo_para_ci
      EPS_BD_HOST: localhost
      EPS_BD_PUERTO: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Análisis estático
        run: |
          ruff check .
          ruff format --check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas con cobertura (mínimo 80 %)
        run: pytest -q --cov=aplicaciones --cov=configuracion --cov-report=term --cov-fail-under=80

  frontend:
    name: Frontend (lint + pruebas + compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Análisis estático
        run: npm run lint
      - name: Pruebas de componentes con cobertura
        run: npm run test:cobertura
      - run: npm run build
